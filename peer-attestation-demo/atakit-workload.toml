# Peer attestation demo: two CVM instances use atakit-verifierd to verify each
# other's current session, then exchange keys for an encrypted-message demo.
#
# Deploy the same archive to two CVMs. Per-instance config (node name, peer
# address) comes from unmeasured-data/peer-config.json, provided by the
# operator at deploy time.
#
# The encrypted-message framing is not a secure channel protocol. It does not
# authenticate its frame header and it does not reject replayed frames.

format = 6

[package]
unmeasured-data = ["/peer-config.json"]

[workload]
name = "peer-attestation-demo"
version = "v0.0.7"
base-image-mode = "whitelist"
base-image = ["0xaef8fc89416f01494ec6534de68d30aab26d7598db8a05967b0ba7d3ecb259d2/automata-linux:v0.3.0-debug"]
image = { build = ".", containerfile = "Containerfile" }
ports = ["3000:3000", "4000:4000"]
restart = "unless-stopped"
atakit-portal = true
unmeasured-data = true
workload-logs = true

[workload.environment]
DASHBOARD_PORT = "3000"
PEER_PORT = "4000"
VERIFIERD_URL = "http://atakit-verifierd:9100"
EXPECTED_BASE_IMAGE_REF = "0xaef8fc89416f01494ec6534de68d30aab26d7598db8a05967b0ba7d3ecb259d2/automata-linux:v0.3.0-debug"
EXPECTED_WORKLOAD_REF = "0xaef8fc89416f01494ec6534de68d30aab26d7598db8a05967b0ba7d3ecb259d2/peer-attestation-demo:v0.0.7"

[workload.logging]
log-readers = ["peer-attestation-demo"]

[dependencies.atakit-verifierd]
image = { file = "./images/atakit-verifierd.tar" }
restart = "unless-stopped"

[dependencies.atakit-verifierd.environment]
VERIFIERD_LISTEN = "0.0.0.0:9100"
VERIFIERD_TRUST_MODE = "chain"
VERIFIERD_RPC_URL = "http://139.99.100.76:8545"
VERIFIERD_CHAIN_ID = "31337"
VERIFIERD_SESSION_REGISTRY = "0xb300837aa0d64a1e0CeF4E8AcA5b192e2a166B8E"

[firewall]
allow = ["3000/tcp", "4000/tcp"]
